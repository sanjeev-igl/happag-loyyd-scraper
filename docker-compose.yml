name: hapag-lloyd-scraper

services:
  # ---- LGTM stack ----------------------------------------------------

  loki:
    image: grafana/loki:3.2.1
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3105:3100"
    networks: [lgtm]

  promtail:
    image: grafana/promtail:3.2.1
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./observability/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - ./logs:/var/log/scraper:ro
    depends_on: [loki]
    networks: [lgtm]

  tempo:
    image: grafana/tempo:2.6.1
    command: -config.file=/etc/tempo/tempo-config.yaml
    volumes:
      - ./observability/tempo/tempo-config.yaml:/etc/tempo/tempo-config.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3205:3200"   # Tempo HTTP API
      - "4331:4317"   # OTLP gRPC (direct, if bypassing the collector)
      - "4332:4318"   # OTLP HTTP
    networks: [lgtm]

  prometheus:
    image: prom/prometheus:v3.0.1
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --web.enable-remote-write-receiver
    volumes:
      - ./observability/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus
    ports:
      - "9096:9090"
    networks: [lgtm]

  pushgateway:
    image: prom/pushgateway:v1.11.0
    ports:
      - "9097:9091"
    networks: [lgtm]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4333:4317"   # OTLP gRPC (scraper sends traces/metrics here)
      - "4334:4318"   # OTLP HTTP
    depends_on: [tempo, prometheus]
    networks: [lgtm]

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_FEATURE_TOGGLES_ENABLE: "traceqlEditor"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3005:3000"
    depends_on: [loki, tempo, prometheus]
    networks: [lgtm]

  # ---- Application -----------------------------------------------------

  scraper:
    build: .
    env_file:
      - .env
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      PROMETHEUS_PUSHGATEWAY_URL: http://pushgateway:9091
      HL_HEADLESS: "true"
    volumes:
      - ./logs:/app/logs
      - ./output:/app/output
      - ./checkpoint.json:/app/checkpoint.json
    depends_on: [otel-collector, pushgateway]
    networks: [lgtm]
    profiles: ["scrape"]   # `docker compose --profile scrape run scraper [args]`

networks:
  lgtm:
    driver: bridge

volumes:
  loki-data:
  tempo-data:
  prometheus-data:
  grafana-data:
