global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Batch-job pattern: the scraper doesn't run as a long-lived server, so it
# pushes metrics to Pushgateway at the end of each run instead of exposing
# a /metrics endpoint for Prometheus to scrape directly.
# Remote-write ingestion (used by Tempo's metrics-generator) is enabled via
# the --web.enable-remote-write-receiver CLI flag in docker-compose.yml.

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
