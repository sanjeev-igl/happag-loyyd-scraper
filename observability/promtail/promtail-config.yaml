server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: hapag_lloyd_scraper
    static_configs:
      - targets:
          - localhost
        labels:
          job: hapag_lloyd_scraper
          service_name: hapag-lloyd-scraper
          __path__: /var/log/scraper/**/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            timestamp: timestamp
            message: message
      - labels:
          level:
      - timestamp:
          source: timestamp
          format: RFC3339
